=>['Logo yok',...Object.keys(logos).sort((a,b)=>a.localeCompare(b,'tr'))].forEach((n,i)=>g(id).add(new Option(n,i?n:''))));function update(){g('preview').textContent=g('name').value;g('preview').style.color=color;g('preview').style.fontFamily=g('font').value;for(const [id,sel] of [['lp','left'],['rp','right']]){let img=g(id),src=logos[g(sel).value];if(src)img.src=src;else img.removeAttribute('src')}let t=g('preview');t.style.fontSize='';let max=t.clientHeight;let size=parseFloat(getComputedStyle(t).fontSize);while(t.scrollWidth>t.clientWidth&&size>5){size--;t.style.fontSize=size+'px'}}['name','font','left','right'].forEach(id=>g(id).addEventListener('input',update));function render(){g('cart').textContent='';cart.forEach((x,i)=>{let p=document.createElement('p');p.textContent=x.name+' — '+x.left+' / '+x.right+' — 450 TL ';let b=document.createElement('button');b.textContent='Sil';b.onclick=()=>{cart.splice(i,1);render()};p.appendChild(b);g('cart').appendChild(p)});if(cart.length){let p=document.createElement('p');p.textContent='Deneme sepeti: '+cart.length+' takım — '+cart.length*450+' TL';g('cart').appendChild(p)}}g('buy').onclick=()=>{if(g('name').value.trim()){cart.push({name:g('name').value,left:g('left').value,right:g('right').value,color,font:g('font').value});render()}};update();window.addEventListener("resize",update);if(document.fonts)document.fonts.ready.then(update);</script></html>
