 ve ödeme kapalıdır.</p></footer></main><script>const g=id=>document.getElementById(id);let color='#fff',cart=[];for(let i=0;i<72;i++)g('slots').appendChild(document.createElement('i'));[['Beyaz','#fff'],['Kırmızı','#f00'],['Sarı','#ffe500'],['Mavi','#06f'],['Yeşil','#00b54a'],['Turuncu','#f80'],['Gümüş ayna','#c0c0c0'],['Altın ayna','#d4af37']].forEach(([n,c],i)=>{let b=document.createElement('button');b.style.background=c;b.title=n;b.setAttribute('aria-label',n);if(!i)b.className='active';b.onclick=()=>{color=c;document.querySelectorAll('.colors button').forEach(x=>x.classList.remove('active'));b.classList.add('active');update()};g('colors').appendChild(b)});['left','right'].forEach(id=>['Logo yok','BMW','M','AMG','VW','AUDI','HONDA','FIAT','FORD','TR'].forEach((n,i)=>g(id).add(new Option(n,i?n:''))));function update(){g('preview').textContent=g('name').value;g('preview').style.color=color;g('preview').style.fontFamily=g('font').value;g('lp').textContent=g('left').value;g('rp').textContent=g('right').value;g('lp').style.color=g('rp').style.color=color}['name','font','left','right'].forEach(id=>g(id).addEventListener('input',update));function render(){g('cart').replaceChildren();cart.forEach((x,i)=>{let p=document.createElement('p');p.textContent=x.name+' — '+x.left+' / '+x.right+' — 450 ₺ ';let b=document.createElement('button');b.textContent='Sil';b.onclick=()=>{cart.splice(i,1);render()};p.appendChild(b);g('cart').appendChild(p)});if(cart.length){let p=document.createElement('p');p.textContent='Deneme sepeti: '+cart.length+' takım — '+cart.length*450+' ₺';g('cart').appendChild(p)}}g('buy').onclick=()=>{if(g('name').value.trim()){cart.push({name:g('name').value,left:g('left').value,right:g('right').value,color,font:g('font').value});render()}};update();</script></html>
